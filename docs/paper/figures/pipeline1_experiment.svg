<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <title>Locked A1–A5 source-retrieval diagnostic</title>
  <desc>A1 and A2 feed RRF for A3. A4 reranks Dense candidates directly; A5 reranks fused candidates. Only the top 50 documents are reranked.</desc>
  <defs>
    <style>
      .title { font: 700 38px Arial, sans-serif; fill: #0f172a; }
      .head { font: 700 24px Arial, sans-serif; fill: #0f172a; }
      .body { font: 21px Arial, sans-serif; fill: #334155; }
      .small { font: 18px Arial, sans-serif; fill: #475569; }
      .metric { font: 700 21px Arial, sans-serif; fill: #991b1b; }
      .box { stroke-width: 3; rx: 16; }
      .arrow { stroke: #334155; stroke-width: 3.5; stroke-linejoin: round; fill: none; }
      .arrowhead { fill: #334155; }
    </style>
  </defs>
  <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>
  <text x="800" y="58" text-anchor="middle" class="title">Locked A1–A5 source-retrieval diagnostic</text>
  <text x="800" y="103" text-anchor="middle" class="small">A1–A3: retrieval baselines · A4: Dense + Cross-Encoder · A5: RRF + Cross-Encoder</text>

  <rect x="45" y="315" width="220" height="170" class="box" fill="#f1f5f9" stroke="#475569"/>
  <text x="155" y="365" text-anchor="middle" class="head">Oracle query</text>
  <text x="155" y="405" text-anchor="middle" class="body">Suspicious-span</text>
  <text x="155" y="440" text-anchor="middle" class="body">window</text>

  <rect x="340" y="145" width="300" height="210" class="box" fill="#dbeafe" stroke="#2563eb"/>
  <text x="490" y="195" text-anchor="middle" class="head">A1: lexical view</text>
  <text x="490" y="240" text-anchor="middle" class="body">Fixed windows</text>
  <text x="490" y="278" text-anchor="middle" class="body">BM25 (k1=1.2, b=0.75)</text>
  <text x="490" y="316" text-anchor="middle" class="small">Top 100 source documents</text>

  <rect x="340" y="500" width="300" height="210" class="box" fill="#dcfce7" stroke="#16a34a"/>
  <text x="490" y="550" text-anchor="middle" class="head">A2: semantic view</text>
  <text x="490" y="595" text-anchor="middle" class="body">Structure-aware chunks</text>
  <text x="490" y="633" text-anchor="middle" class="body">multilingual E5-small</text>
  <text x="490" y="671" text-anchor="middle" class="small">Top 100 source documents</text>

  <rect x="735" y="315" width="250" height="170" class="box" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="860" y="365" text-anchor="middle" class="head">A3: RRF</text>
  <text x="860" y="405" text-anchor="middle" class="body">Equal weight</text>
  <text x="860" y="440" text-anchor="middle" class="body">k = 60</text>

  <rect x="1090" y="265" width="300" height="270" class="box" fill="#fee2e2" stroke="#dc2626"/>
  <text x="1240" y="315" text-anchor="middle" class="head">A4 / A5: reranking</text>
  <text x="1240" y="355" text-anchor="middle" class="body">Cross-Encoder top 50</text>
  <text x="1240" y="393" text-anchor="middle" class="body">max length = 512</text>
  <text x="1240" y="438" text-anchor="middle" class="metric">97.5% pairs truncated</text>
  <text x="1240" y="478" text-anchor="middle" class="small">Support passage controls what</text>
  <text x="1240" y="505" text-anchor="middle" class="small">the reranker is allowed to see</text>

  <rect x="1450" y="315" width="120" height="170" class="box" fill="#f8fafc" stroke="#475569"/>
  <text x="1510" y="365" text-anchor="middle" class="head">Ranked</text>
  <text x="1510" y="400" text-anchor="middle" class="head">sources</text>
  <text x="1510" y="445" text-anchor="middle" class="small">+ spans</text>

  <g aria-label="Query to A1 lexical retrieval">
    <path d="M269 370 H284 Q300 370 300 354 V266 Q300 250 316 250 H319" class="arrow"/>
    <polygon points="318,244 332,250 318,256" class="arrowhead"/>
  </g>
  <g aria-label="Query to A2 Dense retrieval">
    <path d="M269 430 H284 Q300 430 300 446 V589 Q300 605 316 605 H319" class="arrow"/>
    <polygon points="318,599 332,605 318,611" class="arrowhead"/>
  </g>
  <g aria-label="A1 lexical candidates to RRF">
    <path d="M644 250 H662 Q680 250 680 268 V347 Q680 365 698 365 H714" class="arrow"/>
    <polygon points="713,359 727,365 713,371" class="arrowhead"/>
  </g>
  <g aria-label="A2 Dense candidates to RRF">
    <path d="M644 605 H662 Q680 605 680 587 V453 Q680 435 698 435 H714" class="arrow"/>
    <polygon points="713,429 727,435 713,441" class="arrowhead"/>
  </g>
  <g aria-label="A5 fused candidates to Cross-Encoder">
    <path d="M989 400 H1069" class="arrow"/>
    <polygon points="1068,394 1082,400 1068,406" class="arrowhead"/>
    <text x="1034" y="380" text-anchor="middle" class="small">A5: fused</text>
  </g>
  <g aria-label="A4 Dense candidates directly to Cross-Encoder without RRF">
    <path d="M644 655 H1027 Q1045 655 1045 637 V508 Q1045 490 1063 490 H1069" class="arrow"/>
    <polygon points="1068,484 1082,490 1068,496" class="arrowhead"/>
    <text x="850" y="635" text-anchor="middle" class="small">A4: Dense candidates</text>
  </g>
  <g aria-label="Cross-Encoder output to ranked sources">
    <path d="M1394 400 H1429" class="arrow"/>
    <polygon points="1428,394 1442,400 1428,406" class="arrowhead"/>
  </g>

  <rect x="320" y="770" width="1000" height="82" rx="16" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="820" y="807" text-anchor="middle" class="body">A5 gate: 36 Dense Top-10 hits are demoted by RRF; median gold rank = 57.5,</text>
  <text x="820" y="837" text-anchor="middle" class="body">outside the top-50 reranking stage.</text>
</svg>
