openapi: 3.1.0
info:
  title: Evidence-Grounded Report Assessment API
  version: 0.1.0-draft
  description: >-
    Review-candidate contract for W2.3. It describes intended behavior and does
    not claim that the API has been implemented.
servers:
  - url: /api/v1
tags:
  - name: Auth
  - name: Workspaces
  - name: Reports
  - name: Sources
  - name: Jobs
  - name: Rubrics
  - name: Analysis
  - name: Review
  - name: Lifecycle
security:
  - sessionCookie: []
paths:
  /auth/sessions:
    post:
      tags: [Auth]
      operationId: createSession
      summary: Authenticate and create a server-side session
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session created; response also sets the HttpOnly session cookie
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentActor
      summary: Return the authenticated actor and scoped memberships
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Current actor
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actor'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/session:
    delete:
      tags: [Auth]
      operationId: deleteSession
      summary: Revoke the current session
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Session revoked
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /workspaces:
    get:
      tags: [Workspaces]
      operationId: listWorkspaces
      summary: List workspaces visible to the current actor
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Workspace page
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspacePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /workspaces/{workspace_id}/reports:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Reports]
      operationId: listReports
      summary: List reports in the caller's allowed scope
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Report page
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Reports]
      operationId: createReport
      summary: Upload a report and create its first immutable version
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentUpload'
      responses:
        '202':
          description: Report accepted for validation and parsing
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncDocumentOperation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /workspaces/{workspace_id}/reports/{report_id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ReportId'
    get:
      tags: [Reports]
      operationId: getReport
      summary: Get a report and its current version state
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Report
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /workspaces/{workspace_id}/reports/{report_id}/versions:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ReportId'
    post:
      tags: [Reports]
      operationId: createReportVersion
      summary: Upload a new immutable report version
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VersionUpload'
      responses:
        '202':
          description: Version accepted for validation and parsing
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncDocumentOperation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /workspaces/{workspace_id}/sources:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Sources]
      operationId: listSources
      summary: List governed corpus sources
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Source page
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourcePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Sources]
      operationId: createSource
      summary: Upload a corpus source; indexing remains gated by governance
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SourceUpload'
      responses:
        '202':
          description: Source accepted into quarantine
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncDocumentOperation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /workspaces/{workspace_id}/sources/{source_id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/SourceId'
    get:
      tags: [Sources]
      operationId: getSource
      summary: Get a source and its governance/current version state
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Source
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /workspaces/{workspace_id}/sources/{source_id}/versions:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/SourceId'
    post:
      tags: [Sources]
      operationId: createSourceVersion
      summary: Upload a new immutable source version
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SourceVersionUpload'
      responses:
        '202':
          description: Source version accepted into quarantine
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncDocumentOperation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /workspaces/{workspace_id}/document-versions/{version_id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/VersionId'
    get:
      tags: [Reports, Sources]
      operationId: getDocumentVersion
      summary: Get immutable version and processing/provenance state
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Document version
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /workspaces/{workspace_id}/document-versions/{version_id}/chunks:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/VersionId'
    get:
      tags: [Reports, Sources]
      operationId: listDocumentChunks
      summary: List chunks with stable raw locators
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Chunk page
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChunkPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /workspaces/{workspace_id}/jobs/{job_id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [Jobs]
      operationId: getJob
      summary: Get safe job state and bounded progress
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Job
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /workspaces/{workspace_id}/jobs/{job_id}:cancel:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/JobId'
    post:
      tags: [Jobs]
      operationId: cancelJob
      summary: Request cancellation at a safe checkpoint
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '202':
          description: Cancellation requested
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncJobOperation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /workspaces/{workspace_id}/jobs/{job_id}:retry:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/JobId'
    post:
      tags: [Jobs]
      operationId: retryJob
      summary: Retry a retryable terminal job with the same immutable inputs
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '202':
          description: Retry accepted
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncJobOperation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /workspaces/{workspace_id}/rubrics:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Rubrics]
      operationId: listRubrics
      summary: List rubrics in the workspace
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Rubric page
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RubricPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Rubrics]
      operationId: createRubric
      summary: Create a rubric and its first draft version
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRubricRequest'
      responses:
        '201':
          description: Rubric created
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rubric'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /workspaces/{workspace_id}/rubrics/{rubric_id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/RubricId'
    get:
      tags: [Rubrics]
      operationId: getRubric
      summary: Get a rubric and current version pointer
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Rubric
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rubric'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /workspaces/{workspace_id}/rubrics/{rubric_id}/versions:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/RubricId'
    post:
      tags: [Rubrics]
      operationId: createRubricVersion
      summary: Create or clone a draft rubric version
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRubricVersionRequest'
      responses:
        '201':
          description: Draft version created
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RubricVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /workspaces/{workspace_id}/rubric-versions/{version_id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/VersionId'
    put:
      tags: [Rubrics]
      operationId: replaceRubricDraft
      summary: Replace a draft rubric version
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RubricDefinition'
      responses:
        '200':
          description: Draft updated
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RubricVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /workspaces/{workspace_id}/rubric-versions/{version_id}:publish:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/VersionId'
    post:
      tags: [Rubrics]
      operationId: publishRubricVersion
      summary: Validate and publish an immutable rubric version
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Rubric version published
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RubricVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /workspaces/{workspace_id}/reports/{report_id}/analysis-runs:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ReportId'
    post:
      tags: [Analysis]
      operationId: createAnalysisRun
      summary: Create a version-locked similarity, assessment, or experiment run
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnalysisRunRequest'
      responses:
        '202':
          description: Run accepted
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncAnalysisOperation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /workspaces/{workspace_id}/analysis-runs/{run_id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Analysis]
      operationId: getAnalysisRun
      summary: Get run state and locked provenance summary
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Analysis run
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisRun'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /workspaces/{workspace_id}/analysis-runs/{run_id}/evidence:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Analysis]
      operationId: listRunEvidence
      summary: List verified evidence for a run
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Evidence page
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidencePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /workspaces/{workspace_id}/analysis-runs/{run_id}/proposal:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Analysis]
      operationId: getRunProposal
      summary: Get the reviewable proposal produced by a completed run
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Assessment proposal
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentProposal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /workspaces/{workspace_id}/assessment-proposals/{proposal_id}/reviews:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ProposalId'
    get:
      tags: [Review]
      operationId: listProposalReviews
      summary: List immutable lecturer review revisions
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Review page
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Review]
      operationId: createProposalReview
      summary: Accept, edit, or reject a proposal as a scoped lecturer
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
      responses:
        '201':
          description: Review revision created
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /workspaces/{workspace_id}/reports/{report_id}/publications:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ReportId'
    post:
      tags: [Review]
      operationId: createPublication
      summary: Publish a separately reviewed proposal
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePublicationRequest'
      responses:
        '201':
          description: Publication created
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Publication'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /workspaces/{workspace_id}/reports/{report_id}/publications/current:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ReportId'
    get:
      tags: [Review]
      operationId: getCurrentPublication
      summary: Get the active sanitized publication
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Active publication
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Publication'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /workspaces/{workspace_id}/deletion-requests:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Lifecycle]
      operationId: createDeletionRequest
      summary: Request governed deletion and immediate tombstone when authorized
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeletionRequest'
      responses:
        '202':
          description: Deletion workflow accepted
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncDeletionOperation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /workspaces/{workspace_id}/deletion-requests/{request_id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/DeletionRequestId'
    get:
      tags: [Lifecycle]
      operationId: getDeletionRequest
      summary: Get safe deletion progress and verification summary
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Deletion request
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: Opaque server-side session identifier; HttpOnly and SameSite=Lax
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 128
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 256
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Current resource revision, formatted as "rev-<positive integer>"
      schema:
        type: string
        pattern: '^"rev-[1-9][0-9]*"$'
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    WorkspaceId:
      name: workspace_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OpaqueId'
    ReportId:
      name: report_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OpaqueId'
    SourceId:
      name: source_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OpaqueId'
    VersionId:
      name: version_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OpaqueId'
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OpaqueId'
    RubricId:
      name: rubric_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OpaqueId'
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OpaqueId'
    ProposalId:
      name: proposal_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OpaqueId'
    DeletionRequestId:
      name: request_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OpaqueId'
  headers:
    RequestId:
      description: Correlation ID for support and redacted logs
      schema:
        type: string
    ETag:
      description: Current optimistic concurrency revision
      schema:
        type: string
        pattern: '^"rev-[1-9][0-9]*"$'
    RetryAfter:
      description: Seconds before the client may retry
      schema:
        type: integer
        minimum: 1
  responses:
    BadRequest:
      description: Cursor is malformed, expired, or does not match the endpoint, actor scope, filter, or sort
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INVALID_CURSOR
              message: Cursor is invalid or expired.
              request_id: 01J00000000000000000000000
              details: []
    Unauthorized:
      description: Authentication required or credentials invalid
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated actor lacks the required capability
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource is absent or outside the caller's visible scope
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: State, revision, idempotency, governance, purpose, or evidence conflict
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationFailed:
      description: Request fields violate the contract
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: Upload exceeds the configured size limit
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: File extension, declared type, and sniffed magic are not allowed
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Rate or quota exceeded
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    OpaqueId:
      type: string
      minLength: 16
      maxLength: 128
      description: Opaque application identifier; clients must not infer database type
    Timestamp:
      type: string
      format: date-time
    Sha256:
      type: string
      pattern: '^[a-f0-9]{64}$'
    Revision:
      type: integer
      minimum: 1
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 1024
    SessionInfo:
      type: object
      additionalProperties: false
      required: [actor, csrf_token, expires_at]
      properties:
        actor:
          $ref: '#/components/schemas/Actor'
        csrf_token:
          type: string
        expires_at:
          $ref: '#/components/schemas/Timestamp'
    Actor:
      type: object
      additionalProperties: false
      required: [id, display_name, memberships]
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        display_name:
          type: string
          maxLength: 200
        memberships:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/Membership'
    Membership:
      type: object
      additionalProperties: false
      required: [workspace_id, role, capabilities]
      properties:
        workspace_id:
          $ref: '#/components/schemas/OpaqueId'
        role:
          type: string
          enum: [STUDENT, LECTURER, ADMIN]
        capabilities:
          type: array
          uniqueItems: true
          items:
            type: string
    Workspace:
      type: object
      additionalProperties: false
      required: [id, key, name, status]
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        key:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [ACTIVE, ARCHIVED]
    PageInfo:
      type: object
      additionalProperties: false
      required: [limit, has_more, next_cursor]
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
        has_more:
          type: boolean
        next_cursor:
          type: [string, 'null']
    WorkspacePage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Workspace'
        page:
          $ref: '#/components/schemas/PageInfo'
    DocumentUpload:
      type: object
      additionalProperties: false
      required: [file, document_key, title]
      properties:
        file:
          type: string
          format: binary
        document_key:
          type: string
          minLength: 1
          maxLength: 128
        title:
          type: string
          minLength: 1
          maxLength: 500
    VersionUpload:
      type: object
      additionalProperties: false
      required: [file]
      properties:
        file:
          type: string
          format: binary
    SourceUpload:
      type: object
      additionalProperties: false
      required: [file, document_key, title, governance_record_id]
      properties:
        file:
          type: string
          format: binary
        document_key:
          type: string
          minLength: 1
          maxLength: 128
        title:
          type: string
          minLength: 1
          maxLength: 500
        governance_record_id:
          $ref: '#/components/schemas/OpaqueId'
    SourceVersionUpload:
      type: object
      additionalProperties: false
      required: [file, governance_record_id]
      properties:
        file:
          type: string
          format: binary
        governance_record_id:
          $ref: '#/components/schemas/OpaqueId'
    ProcessingState:
      type: string
      enum: [QUARANTINED, QUEUED, PARSING, PARSED, INDEXING, READY, FAILED]
    LifecycleState:
      type: string
      enum: [ACTIVE, ARCHIVED, TOMBSTONED, PURGING, PURGED]
    GovernanceState:
      type: string
      enum: [PENDING, APPROVED, REJECTED, REVOKED, EXPIRED]
    Report:
      type: object
      additionalProperties: false
      required: [id, workspace_id, document_key, title, owner_user_id, current_version_id, lifecycle_state, revision]
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        workspace_id:
          $ref: '#/components/schemas/OpaqueId'
        document_key:
          type: string
        title:
          type: string
        owner_user_id:
          $ref: '#/components/schemas/OpaqueId'
        current_version_id:
          $ref: '#/components/schemas/OpaqueId'
        lifecycle_state:
          $ref: '#/components/schemas/LifecycleState'
        revision:
          $ref: '#/components/schemas/Revision'
    Source:
      type: object
      additionalProperties: false
      required: [id, workspace_id, document_key, title, current_version_id, governance_state, lifecycle_state, revision]
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        workspace_id:
          $ref: '#/components/schemas/OpaqueId'
        document_key:
          type: string
        title:
          type: string
        current_version_id:
          $ref: '#/components/schemas/OpaqueId'
        governance_state:
          $ref: '#/components/schemas/GovernanceState'
        lifecycle_state:
          $ref: '#/components/schemas/LifecycleState'
        revision:
          $ref: '#/components/schemas/Revision'
    ReportPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Report'
        page:
          $ref: '#/components/schemas/PageInfo'
    SourcePage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Source'
        page:
          $ref: '#/components/schemas/PageInfo'
    ParserSpec:
      type: object
      additionalProperties: false
      required: [name, version, config_sha256]
      properties:
        name:
          type: string
        version:
          type: string
        config_sha256:
          $ref: '#/components/schemas/Sha256'
    DocumentVersion:
      type: object
      additionalProperties: false
      required:
        - id
        - document_id
        - version_no
        - content_sha256
        - processing_state
        - lifecycle_state
        - governance_state
        - element_count
        - chunk_count
        - revision
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        document_id:
          $ref: '#/components/schemas/OpaqueId'
        version_no:
          type: integer
          minimum: 1
        content_sha256:
          $ref: '#/components/schemas/Sha256'
        processing_state:
          $ref: '#/components/schemas/ProcessingState'
        lifecycle_state:
          $ref: '#/components/schemas/LifecycleState'
        governance_state:
          $ref: '#/components/schemas/GovernanceState'
        parser_spec:
          oneOf:
            - $ref: '#/components/schemas/ParserSpec'
            - type: 'null'
        chunker_spec:
          oneOf:
            - $ref: '#/components/schemas/ParserSpec'
            - type: 'null'
        element_count:
          type: integer
          minimum: 0
        chunk_count:
          type: integer
          minimum: 0
        failure_code:
          type: [string, 'null']
        revision:
          $ref: '#/components/schemas/Revision'
    Locator:
      type: object
      additionalProperties: false
      required: [locator_version, page_index, section_path, raw_char_start, raw_char_end]
      properties:
        locator_version:
          type: integer
          minimum: 1
        page_index:
          type: [integer, 'null']
          minimum: 0
        page_label:
          type: [string, 'null']
        section_path:
          type: array
          items:
            type: string
        block_id:
          type: [string, 'null']
        raw_char_start:
          type: integer
          minimum: 0
        raw_char_end:
          type: integer
          minimum: 0
    Chunk:
      type: object
      additionalProperties: false
      required: [id, document_version_id, chunk_key, order, normalized_text, content_sha256, locator]
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        document_version_id:
          $ref: '#/components/schemas/OpaqueId'
        chunk_key:
          type: string
        order:
          type: integer
          minimum: 0
        normalized_text:
          type: string
        content_sha256:
          $ref: '#/components/schemas/Sha256'
        locator:
          $ref: '#/components/schemas/Locator'
    ChunkPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Chunk'
        page:
          $ref: '#/components/schemas/PageInfo'
    JobState:
      type: string
      enum: [QUEUED, CLAIMED, RUNNING, SUCCEEDED, FAILED_RETRYABLE, FAILED_FINAL, CANCELLED]
    Job:
      type: object
      additionalProperties: false
      required: [id, job_type, resource_id, state, attempt, max_attempts, progress, revision, created_at]
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        job_type:
          type: string
        resource_id:
          $ref: '#/components/schemas/OpaqueId'
        state:
          $ref: '#/components/schemas/JobState'
        attempt:
          type: integer
          minimum: 0
        max_attempts:
          type: integer
          minimum: 1
        progress:
          type: object
          additionalProperties: false
          required: [step, completed, total]
          properties:
            step:
              type: string
            completed:
              type: integer
              minimum: 0
            total:
              type: [integer, 'null']
              minimum: 0
        error_code:
          type: [string, 'null']
        revision:
          $ref: '#/components/schemas/Revision'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        completed_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    AsyncJobOperation:
      type: object
      additionalProperties: false
      required: [job_id, state]
      properties:
        job_id:
          $ref: '#/components/schemas/OpaqueId'
        state:
          $ref: '#/components/schemas/JobState'
    AsyncDocumentOperation:
      type: object
      additionalProperties: false
      required: [document_id, document_version_id, job_id, state]
      properties:
        document_id:
          $ref: '#/components/schemas/OpaqueId'
        document_version_id:
          $ref: '#/components/schemas/OpaqueId'
        job_id:
          $ref: '#/components/schemas/OpaqueId'
        state:
          type: string
          enum: [QUARANTINED, QUEUED]
    Rubric:
      type: object
      additionalProperties: false
      required: [id, workspace_id, rubric_key, title, current_version_id, lifecycle_state, revision]
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        workspace_id:
          $ref: '#/components/schemas/OpaqueId'
        rubric_key:
          type: string
        title:
          type: string
        current_version_id:
          $ref: '#/components/schemas/OpaqueId'
        lifecycle_state:
          $ref: '#/components/schemas/LifecycleState'
        revision:
          $ref: '#/components/schemas/Revision'
    RubricPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Rubric'
        page:
          $ref: '#/components/schemas/PageInfo'
    CreateRubricRequest:
      type: object
      additionalProperties: false
      required: [rubric_key, title, definition]
      properties:
        rubric_key:
          type: string
          minLength: 1
          maxLength: 128
        title:
          type: string
          minLength: 1
          maxLength: 500
        definition:
          $ref: '#/components/schemas/RubricDefinition'
    CreateRubricVersionRequest:
      type: object
      additionalProperties: false
      properties:
        clone_from_version_id:
          $ref: '#/components/schemas/OpaqueId'
        definition:
          $ref: '#/components/schemas/RubricDefinition'
      oneOf:
        - required: [clone_from_version_id]
        - required: [definition]
    RubricDefinition:
      type: object
      additionalProperties: false
      required: [criteria]
      properties:
        criteria:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/RubricCriterion'
    RubricCriterion:
      type: object
      additionalProperties: false
      required: [criterion_key, title, weight, checklists, levels]
      properties:
        criterion_key:
          type: string
        title:
