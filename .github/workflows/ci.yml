name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            research/requirements-research.txt
            services/backend/requirements-app.txt
            services/backend/requirements-dev.txt
      - name: Install Python dependencies
        run: >-
          python -m pip install
          -r research/requirements-research.txt
          -r services/backend/requirements-app.txt
      - name: Validate reviewed OpenAPI document
        run: >-
          python -c "from pathlib import Path; import yaml;
          value=yaml.safe_load(Path('docs/api/openapi-v1.yaml').read_text());
          assert str(value['openapi']).startswith('3.'); assert value['paths']"
      - name: Run synthetic and unit test suites
        run: python -m pytest research/tests services/backend/tests -q

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Type-check and build
        run: npm run build
